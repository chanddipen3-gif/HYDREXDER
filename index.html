<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Bluetooth Weight Transmitter</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <header>
            <h1>Weight Transmitter</h1>
            <div id="status" class="status disconnected">Disconnected</div>
        </header>

        <main>
            <section class="connection-section">
                <button id="connectBtn" class="btn primary-btn">Scan & Connect</button>
                <button id="disconnectBtn" class="btn danger-btn hidden">Disconnect</button>
            </section>

            <section class="weight-section">
                <h2>Preset Weights</h2>
                <div class="preset-grid">
                    <button class="preset-btn" data-weight="0.5">500g</button>
                    <button class="preset-btn" data-weight="1">1kg</button>
                    <button class="preset-btn" data-weight="2.5">2.5kg</button>
                    <button class="preset-btn" data-weight="5">5kg</button>
                    <button class="preset-btn" data-weight="7.6">7.6kg</button>
                    <button class="preset-btn" data-weight="12.4">12.4kg</button>
                    <button class="preset-btn" data-weight="25">25kg</button>
                </div>

                <div class="custom-weight">
                    <h2>Custom Weight</h2>
                    <div class="input-group">
                        <input type="number" id="customWeightInput" placeholder="Enter value" step="0.001" min="0">
                        <select id="weightUnit">
                            <option value="kg">kg</option>
                            <option value="g">g</option>
                        </select>
                    </div>
                </div>

                <div class="selected-display">
                    <h3>Selected Weight:</h3>
                    <div id="selectedWeightValue" class="value-display">--</div>
                </div>
            </section>

            <section class="action-section">
                <button id="sendBtn" class="btn action-btn" disabled>Send Weight</button>
                <div id="feedbackMsg" class="feedback-msg"></div>
            </section>
        </main>
    </div>
    <script src="script.js"></script>
</body>
</html>
