<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CleanPro Manager</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <!-- Leaflet -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <!-- Custom CSS -->
    <link rel="stylesheet" href="styles.css">

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        primary: '#3b82f6',
                        secondary: '#1e293b',
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-gray-100 dark:bg-gray-900 text-gray-900 dark:text-gray-100 font-sans antialiased">
    <!-- App Container -->
    <div id="app" class="flex h-screen overflow-hidden">
        
        <!-- Sidebar -->
        <aside id="sidebar" class="w-64 bg-secondary text-white hidden md:flex flex-col transition-all duration-300 relative z-20 shadow-xl">
            <div class="h-16 flex items-center justify-between px-4 border-b border-gray-700">
                <span class="text-xl font-bold tracking-wider"><i class="fa-solid fa-broom mr-2"></i>CleanPro</span>
                <button id="toggle-sidebar" class="text-gray-400 hover:text-white md:hidden">
                    <i class="fas fa-times"></i>
                </button>
            </div>

            <nav class="flex-1 overflow-y-auto py-4">
                <ul class="space-y-1" id="nav-links">
                    <!-- Links injected by JS based on role -->
                </ul>
            </nav>

            <div class="p-4 border-t border-gray-700">
                <div class="flex items-center space-x-3 mb-4">
                    <div class="w-10 h-10 rounded-full bg-primary flex items-center justify-center font-bold" id="user-avatar">
                        U
                    </div>
                    <div>
                        <p class="text-sm font-medium" id="user-name">User Name</p>
                        <p class="text-xs text-gray-400" id="user-role">Role</p>
                    </div>
                </div>
                <button id="logout-btn" class="w-full flex items-center justify-center space-x-2 bg-red-600 hover:bg-red-700 text-white px-4 py-2 rounded transition">
                    <i class="fas fa-sign-out-alt"></i>
                    <span>Logout</span>
                </button>
            </div>
        </aside>

        <!-- Main Content Wrapper -->
        <div class="flex-1 flex flex-col relative w-full">

            <!-- Topbar -->
            <header class="h-16 bg-white dark:bg-gray-800 shadow flex items-center justify-between px-4 z-10">
                <div class="flex items-center">
                    <button id="mobile-menu-btn" class="text-gray-600 dark:text-gray-300 hover:text-primary mr-4 md:hidden">
                        <i class="fas fa-bars text-xl"></i>
                    </button>
                    <h1 id="page-title" class="text-xl font-semibold">Dashboard</h1>
                </div>

                <div class="flex items-center space-x-4">
                    <button id="theme-toggle" class="text-gray-600 dark:text-gray-300 hover:text-primary transition">
                        <i class="fas fa-moon text-lg" id="theme-icon"></i>
                    </button>
                </div>
            </header>

            <!-- Main Content Area -->
            <main id="main-content" class="flex-1 overflow-y-auto p-4 md:p-6 bg-gray-50 dark:bg-gray-900 relative">
                <!-- Views injected by JS -->
            </main>

        </div>
    </div>

    <!-- Auth/Paywall Overlay Container -->
    <div id="overlay-container" class="fixed inset-0 z-50 bg-gray-900 flex items-center justify-center hidden">
        <!-- Auth View -->
        <div id="auth-view" class="bg-white dark:bg-gray-800 p-8 rounded-lg shadow-2xl w-full max-w-md hidden">
            <div class="text-center mb-8">
                <i class="fa-solid fa-broom text-4xl text-primary mb-2"></i>
                <h2 class="text-2xl font-bold text-gray-800 dark:text-white">CleanPro Login</h2>
                <p class="text-gray-500 dark:text-gray-400 text-sm mt-1">Enter your assigned ID to continue</p>
            </div>

            <form id="login-form" class="space-y-4">
                <div>
                    <label for="login-id" class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">User ID</label>
                    <input type="text" id="login-id" required placeholder="e.g. CL-001 or EMP-001"
                           class="w-full px-4 py-2 border border-gray-300 dark:border-gray-600 rounded-md focus:ring-primary focus:border-primary bg-white dark:bg-gray-700 text-gray-900 dark:text-white">
                </div>
                <div>
                    <label for="login-password" class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Password</label>
                    <input type="password" id="login-password" required placeholder="Enter password"
                           class="w-full px-4 py-2 border border-gray-300 dark:border-gray-600 rounded-md focus:ring-primary focus:border-primary bg-white dark:bg-gray-700 text-gray-900 dark:text-white">
                </div>
                <div id="login-error" class="text-red-500 text-sm hidden">Invalid credentials.</div>
                <button type="submit" class="w-full bg-primary hover:bg-blue-600 text-white font-bold py-2 px-4 rounded transition">
                    Sign In
                </button>
            </form>
        </div>

        <!-- Paywall View -->
        <div id="paywall-view" class="bg-white dark:bg-gray-800 p-8 rounded-lg shadow-2xl w-full max-w-md text-center hidden">
            <i class="fa-solid fa-lock text-5xl text-red-500 mb-4"></i>
            <h2 class="text-2xl font-bold text-gray-800 dark:text-white mb-2">Subscription Expired</h2>
            <p class="text-gray-600 dark:text-gray-400 mb-6">Your account is currently locked due to an expired subscription. Please renew to regain access.</p>

            <div class="bg-gray-100 dark:bg-gray-700 p-4 rounded-md mb-6">
                <p class="text-sm text-gray-500 dark:text-gray-400">Amount Due</p>
                <p class="text-3xl font-bold text-gray-900 dark:text-white" id="paywall-amount">$0.00</p>
            </div>

            <button id="renew-btn" class="w-full bg-green-500 hover:bg-green-600 text-white font-bold py-3 px-4 rounded transition flex items-center justify-center space-x-2">
                <i class="fa-solid fa-credit-card"></i>
                <span>Pay & Renew Subscription</span>
            </button>

            <button id="paywall-logout" class="mt-4 text-sm text-gray-500 hover:text-gray-700 dark:hover:text-gray-300 underline">
                Log out
            </button>
        </div>
    </div>

    <!-- Toast Notification Container -->
    <div id="toast-container" class="fixed bottom-4 right-4 z-50 flex flex-col space-y-2"></div>

    <!-- Modules -->
    <script src="dashboard.js"></script>
    <script src="crm.js"></script>
    <script src="jobs.js"></script>
    <script src="staff.js"></script>
    <script src="gps.js"></script>
    <script src="financials.js"></script>
    <script src="invoices.js"></script>
    <script src="expenses.js"></script>
    <script src="support.js"></script>
    <script src="settings.js"></script>

    <script src="app.js"></script>
</body>
</html>
